<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - MyWaitTime</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse 70% 55% at 50% -10%, rgba(99, 102, 241, 0.14), transparent 60%), #f8fafc;
            color: #475569; text-align: center; padding: 24px;
        }
        .card { max-width: 480px; }
        .code { font-size: 6rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1;
            background: linear-gradient(120deg, #6366f1 0%, #a855f7 60%, #ec4899 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
        h1 { font-size: 1.6rem; font-weight: 800; color: #0f172a; margin: 18px 0 10px; }
        p { margin-bottom: 28px; }
        a { display: inline-flex; align-items: center; gap: 8px; padding: 13px 26px; border-radius: 999px; font-weight: 600;
            text-decoration: none; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: #fff;
            box-shadow: 0 10px 24px -8px rgba(99, 102, 241, 0.55); transition: transform 0.2s, box-shadow 0.2s; }
        a:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -8px rgba(99, 102, 241, 0.6); }
        .links { margin-top: 26px; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
        .links .secondary { background: rgba(15, 23, 42, 0.05); color: #0f172a; box-shadow: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>Sorry, we couldn&rsquo;t find that page. It may have moved or no longer exists.</p>
        <a href="index.html">&#8592; Back to Home</a>
        <div class="links">
            <a class="secondary" href="app/">Open Web App</a>
            <a class="secondary" href="support.html">Support</a>
        </div>
    </div>
</body>
</html>

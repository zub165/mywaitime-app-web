<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-content { background: #f0f0f0; padding: 20px; margin: 10px 0; border-radius: 5px; }
    </style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f766e" />
  <style id="mobile-enhance">
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { margin: 0; overflow-x: hidden; }
    img, video, iframe, svg, canvas, table { max-width: 100%; height: auto; }
    input, select, textarea, button { max-width: 100%; font-size: 16px; }
    @media (max-width: 768px) {
      body { padding-left: 12px; padding-right: 12px; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
    <h1>Tab Loading Test</h1>
    <button onclick="testTabLoading()">Test Tab Loading</button>
    <div id="tab-content" class="test-content">
        <!-- Content will be loaded here -->
    </div>

    <script>
        async function testTabLoading() {
            const tabName = 'er-wait';
            console.log(`Testing tab loading for: ${tabName}`);
            
            try {
                const response = await fetch(`tabs/${tabName}.html`);
                console.log(`Response status: ${response.status}`);
                
                if (!response.ok) {
                    throw new Error(`Failed to load ${tabName} tab: ${response.status}`);
                }
                
                const content = await response.text();
                console.log(`Tab content fetched, length: ${content.length}`);
                
                const container = document.getElementById('tab-content');
                container.innerHTML = content;
                console.log('Content inserted into DOM');
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('tab-content').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Reset Password - ER Wait Time</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card { max-width: 440px; width: 100%; border: none; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="card shadow p-4">
        <h3 class="mb-1"><i class="fas fa-key text-primary me-2"></i>Reset Password</h3>
        <p class="text-muted mb-4">Enter the 6-digit code from your email, then choose a new password.</p>

        <form id="resetForm">
            <div class="mb-3" id="emailGroup">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
            </div>
            <div class="mb-3" id="codeGroup">
                <label class="form-label" for="code">Reset code</label>
                <input type="text" class="form-control" id="code" inputmode="numeric" maxlength="6"
                       placeholder="6-digit code from email" autocomplete="one-time-code">
            </div>
            <div class="mb-3">
                <label class="form-label" for="newPassword">New Password</label>
                <input type="password" class="form-control" id="newPassword" required
                       placeholder="Min 8 chars, upper, lower, number, special">
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                <i class="fas fa-save me-1"></i>Update Password
            </button>
        </form>

        <div class="mt-3 text-center">
            <a href="index.html">Back to Login</a>
            <span class="mx-2">·</span>
            <a href="smart-login.html">Smart Login</a>
        </div>
        <div id="status" class="alert mt-3 d-none"></div>
    </div>

    <script src="js/auth.js?v=20261016f"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('uid') || '';
        const token = params.get('token') || '';
        const emailParam = params.get('email') || '';
        const codeParam = params.get('code') || '';
        if (emailParam) document.getElementById('email').value = emailParam;
        if (codeParam) document.getElementById('code').value = codeParam;
        if (uid && token) {
            document.getElementById('emailGroup').classList.add('d-none');
            document.getElementById('codeGroup').classList.add('d-none');
        }

        function showStatus(message, type) {
            const el = document.getElementById('status');
            el.className = `alert alert-${type === 'error' ? 'danger' : 'success'} mt-3`;
            el.textContent = message;
            el.classList.remove('d-none');
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (newPassword !== confirmPassword) {
                showStatus('Passwords do not match', 'error');
                return;
            }
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            try {
                const payload = { new_password: newPassword };
                if (uid && token) {
                    payload.uid = uid;
                    payload.token = token;
                } else {
                    const email = document.getElementById('email').value.trim();
                    const code = document.getElementById('code').value.trim();
                    if (!email || !code) {
                        showStatus('Email and 6-digit code from your email are required.', 'error');
                        btn.disabled = false;
                        return;
                    }
                    payload.email = email;
                    payload.code = code;
                }
                const result = await AuthService.confirmPasswordReset(payload);
                if (result.success) {
                    showStatus(result.message + ' You can now log in.', 'success');
                    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                } else {
                    let msg = result.message || 'Password reset failed';
                    if (result.errors) {
                        const parts = [];
                        Object.values(result.errors).forEach((v) => {
                            if (Array.isArray(v)) parts.push(...v);
                            else if (v) parts.push(String(v));
                        });
                        if (parts.length) msg = parts.join(' ');
                    }
                    showStatus(msg, 'error');
                }
            } catch (err) {
                showStatus(err.message || 'Reset failed', 'error');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
